<!DOCTYPE html>
<head>
  <title>ZEFIR</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="https://use.fontawesome.com/releases/v7.0.0/css/all.css">
  
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;

      position: relative;
      background: pink;
    }
    a {
      text-decoration: none;
      color: inherit;
    }
    ul {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    header {
      background: hotpink;
      width: 100%;
      height: 200px;
    }
    #header-nav {
      height: 50px;
      width: 100%;
    }
    #header-slider {
      background: pink;
      height: calc(200px - 50px);
      width: 100%;
      border-radius: 16px 16px 0 0;
    }

    nav {
      height: 75px;
      width: 100%;
      background: hotpink;
    }
    nav li {
      color: #fff;
      font-weight: bold;
      padding: 0 15px;
      display: inline-block;
      vertical-align: top;
      background: pink;
      border-radius: 16px;
      height: 50px;
      margin-top: 12px;

      width: 100px;
    }
    nav ul {
      position: relative;
      width: 100%;
      height: 100%;

      box-sizing: border-box;
      padding: 0 15px;
    }
    nav ul::before {
      content: '<';
      position: absolute;
      left: -5px;
      top: 0;
      bottom: 0;
      width: 30px;
      height: 30px;
      border-radius: 30px;
      background: pink;
      color: white;
      margin: auto;
      line-height: 30px;
      text-align: center;
      font-weight: bold;
    }
    nav ul::after {
      content: '>';
      position: absolute;
      right: -5px;
      top: 0;
      bottom: 0;
      width: 30px;
      height: 30px;
      border-radius: 30px;
      background: pink;
      color: white;
      margin: auto;
      line-height: 30px;
      text-align: center;
      font-weight: bold;
    }
    nav li span {
      display: inline-block;
      vertical-align: top;
    }
    nav li i {
      line-height: 50px;
    }
  </style>
</head>
<body>
  <header>
    <div id='header-nav'>
      
    </div>
    <div id='header-slider'>
      
    </div>
  </header>
  <nav>
    <ul>
      <li><i class="fa-solid fa-circle-arrow-right"></i> <span>Text<br>Text</span></li>
      <li>Text</li>
      <li>Text</li>
    </ul>
  </nav>
</body>
