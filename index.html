<!DOCTYPE html>
<head>
  <title>ZEFIR</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="https://use.fontawesome.com/releases/v7.0.0/css/all.css">
  
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;

      position: relative;
      background: pink;
    }
    a {
      text-decoration: none;
      color: inherit;
    }
    ul {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    header {
      background: hotpink;
      width: 100%;
      height: 200px;
    }
    #header-nav {
      height: 50px;
      width: 100%;
    }
    #header-slider {
      height: calc(200px - 50px);
      width: 100%;
      border-radius: 16px 16px 0 0;
      font-size: 0;
      background: lightpink;
    }
    #header-slider-l {
      width: 50px;
      display: inline-block;
      vertical-align: top;
      height: 100%;
      font-size: 14px;
    }
    #header-slider-r {
      width: calc(100% - 50px);
      display: inline-block;
      vertical-align: top;
      background: pink;
      height: 100%;
      border-radius: 16px 16px 0 0;
      font-size: 14px;
    }
      

    nav {
      height: 75px;
      width: 100%;
      background: hotpink;

      position: relative;
    }
    nav li {
      color: #fff;
      padding: 0 10px;
      display: inline-block;
      vertical-align: top;
      background: pink;
      border-radius: 16px;
      height: 50px;
      margin-top: 12px;

      width: 150px;
      box-sizing: border-box;
    }
    nav ul {
      width: 100%;
      height: 100%;

      box-sizing: border-box;
      padding: 0 15px;

      white-space: nowrap;
      overflow: auto;
    }
    nav::before {
      content: '<';
      position: absolute;
      left: -5px;
      top: 0;
      bottom: 0;
      width: 30px;
      height: 30px;
      border-radius: 30px;
      background: lightpink;
      color: white;
      margin: auto;
      line-height: 30px;
      text-align: center;
      font-weight: bold;
    }
    nav::after {
      content: '>';
      position: absolute;
      right: -5px;
      top: 0;
      bottom: 0;
      width: 30px;
      height: 30px;
      border-radius: 30px;
      background: lightpink;
      color: white;
      margin: auto;
      line-height: 30px;
      text-align: center;
      font-weight: bold;
    }
    nav li span {
      display: inline-block;
      vertical-align: top;
    }
    nav li > i {
      line-height: 50px !important;
    }
    nav li b {
      height: 25px;
      display: inline-block;
      vertical-align: top;
      line-height: 37px;
    }

    #header-nav-menu {
      width: 40px;
      height: 40px;
      background: pink;
      float: right;
      border-radius: 50px;
      margin-top: 5px;
      margin-right: 5px;
    }
    #header-nav-btn {
      line-height: 40px;
      color: #fff;
      text-align: center;
      font-size: 18px;
    }

    #header-logo {
      text-align: center;
    }
    #header-logo span {
      line-height: 150px;
      font-size: 30px;
      font-weight: bold;
      color: white;
    }
  </style>
</head>
<body>
  <header>
    <div id='header-nav'>
      <div id='header-nav-menu'>
        <div id='header-nav-btn'>
          <i class="fa-solid fa-bars"></i>
        </div>
      </div>
    </div>
    <div id='header-slider'>
      <div id='header-slider-l'>
        
      </div>
      <div id='header-slider-r'>
        <div id='header-logo'><span>ZEFIR</span></div>
      </div>
    </div>
  </header>
  <nav>
    <ul>
      <li><i class="fa-solid fa-circle-arrow-right"></i> <span><b>Главная</b><br><i>Text</i></span></li>
      <li><i class="fa-solid fa-circle-arrow-right"></i> <span><b>Словарь</b><br><i>Text</i></span></li>
      <li><i class="fa-solid fa-circle-arrow-right"></i> <span><b>Ресурсы</b><br><i>Text</i></span></li>
      <li><i class="fa-solid fa-circle-arrow-right"></i> <span><b>План счетов</b><br><i>Text</i></span></li>
      <li><i class="fa-solid fa-circle-arrow-right"></i> <span><b>Документы</b><br><i>Text</i></span></li>
    </ul>
  </nav>
  <main>
    <aside>
      <div class="widgets">
        <div class="widgets-title">Категории</div>
        <div class='widgets-sld'>
          <span>Бухгалтерия</span><span>Налогообложения</span><span>1C8.3</span>
        </div>
      </div>
    </aside>
  </main>
</body>
