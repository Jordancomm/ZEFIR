<!DOCTYPE html>
<head>
  <title>ZEFIR</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;

      position: relative;
      background: pink;
    }
    a {
      text-decoration: none;
      color: inherit;
    }
    ul {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    header {
      background: hotpink;
      width: 100%;
      height: 200px;
    }
    #header-nav {
      height: 36px;
      width: 100%;
    }
    #header-slider {
      background: pink;
      height: calc(200px - 36px);
      width: 100%;
      border-radius: 16px 16px 0 0;
    }

    nav {
      height: 75px;
      width: 100%;
      background: hotpink;
    }
    nav li {
      color: #fff;
      font-weight: bold;
      line-height: 75px;
      padding: 0 15px;
      display: inline-block;
      vertical-align: top;
    }
  </style>
</head>
<body>
  <header>
    <div id='header-nav'>
      
    </div>
    <div id='header-slider'>
      
    </div>
  </header>
  <nav>
    <ul>
      <li>Text</li>
      <li>Text</li>
      <li>Text</li>
    </ul>
  </nav>
</body>
